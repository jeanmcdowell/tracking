version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "jeanmcdowell"
    labels:
      - "type: chore"
      - "status: ready"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "jeanmcdowell"
    labels:
      - "type: chore"
      - "status: ready"
